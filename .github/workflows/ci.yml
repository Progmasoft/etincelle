name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Gradle check (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Java 21 is the oldest Java Etincelle supports; 25 is the newest LTS.
        include:
          - os: ubuntu-26.04
            java: "21"
          - os: ubuntu-26.04
            java: "25"
          - os: windows-2025
            java: "21"
          - os: macos-15
            java: "21"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Temurin ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Spotless, javac with -Xlint:all -Werror, Javadoc and every test.
      - name: Check
        shell: bash
        run: ./gradlew check javadoc jacocoTestReport --no-daemon

      - name: Keep the coverage report
        if: matrix.os == 'ubuntu-26.04' && matrix.java == '21'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etincelle-coverage
          path: "**/build/reports/jacoco/test/jacocoTestReport.xml"
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage upload
    # Fork pull requests cannot receive the OIDC token Codecov needs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # The job that can get a token runs no code of the repository.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etincelle-coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: "**/jacocoTestReport.xml"
          fail_ci_if_error: true

  required:
    name: CI Required
    if: always()
    needs: [check]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
